name: Hive Registration Monitor
on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:

jobs:
  check-registrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check HiveGate Dashboard
        id: dashboard
        run: |
          RESPONSE=$(curl -s https://hivegate.onrender.com/v1/gate/dashboard)
          echo "dashboard=$RESPONSE" >> $GITHUB_OUTPUT
          TOTAL=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_agents', d.get('data', {}).get('total_agents', 0)))" 2>/dev/null || echo "0")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Check PyPI Downloads
        id: pypi
        run: |
          STATS=$(curl -s https://pypistats.org/api/packages/hive-civilization-sdk/recent)
          DOWNLOADS=$(echo $STATS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('last_day',0))" 2>/dev/null || echo "0")
          echo "downloads=$DOWNLOADS" >> $GITHUB_OUTPUT

      - name: Create summary issue if activity detected
        if: steps.dashboard.outputs.total != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const total = '${{ steps.dashboard.outputs.total }}';
            const downloads = '${{ steps.pypi.outputs.downloads }}';
            const now = new Date().toISOString();

            // Check if a recent issue already exists to avoid duplicates
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'hive-metrics',
              state: 'open',
              per_page: 1
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `📊 **Hive Metrics Update** — ${now}\n- Total registered agents: ${total}\n- PyPI downloads (last 24h): ${downloads}`
              });
            } else {
              // Create new tracking issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Hive Live Metrics — ${now.split('T')[0]}`,
                body: `## Hive Civilization — Live Network Metrics\n\n- **Total registered agents:** ${total}\n- **PyPI downloads (last 24h):** ${downloads}\n- **Dashboard:** https://hivegate.onrender.com/v1/gate/dashboard\n- **PyPI:** https://pypi.org/project/hive-civilization-sdk/\n\nThis issue is updated every 4 hours by the registration monitor.`,
                labels: ['hive-metrics']
              });
            }
